<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOPIM_MONEY</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light style-purple">
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">💸</div>
            <h1 class="splash-title">KOPIM_MONEY</h1>
            <p class="splash-subtitle">Твой личный помощник</p>
        </div>
    </div>

    <div class="app-container">
        <header>
            <div class="greeting">Привет, <span id="user-name">друг</span></div>
            <div class="date" id="current-date">Ноябрь 2026</div>
        </header>

        <main id="screen-home" class="screen active">
            <section class="goals-section">
                <div class="section-header">
                    <h2>Мои цели <span id="goals-count" class="badge">0/15</span></h2>
                </div>
                <div id="goals-list" class="goals-list"></div>
                <button id="add-goal-btn" class="btn-outline">+ Добавить цель</button>
            </section>

            <section class="money-card">
                <div class="card-header">
                    <span class="icon">💳</span> Осталось в этом месяце
                </div>
                <div class="card-amount" id="display-remainder">0 ₽</div>
                
                <div class="money-details">
                    <div class="detail-item">
                        <span class="detail-label">Доход</span>
                        <span class="detail-value" id="display-income">0 ₽</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Потрачено</span>
                        <span class="detail-value" id="display-spent">0 ₽</span>
                    </div>
                </div>

                <div class="income-buttons">
                    <button id="add-income-btn" class="btn-add-money">+ Добавить</button>
                    <button id="subtract-income-btn" class="btn-subtract-money">− Вычесть</button>
                </div>
            </section>

            <div class="pixel-pet-container">
                <img id="main-pet-img" src="pet.gif" alt="Питомец" class="pixel-pet">
            </div>
        </main>

        <main id="screen-expenses" class="screen hidden">
            <h2>Траты</h2>
            <div class="categories-list" id="categories-list"></div>
        </main>

        <main id="screen-stats" class="screen hidden">
            <h2>Статистика</h2>
            
            <div class="chart-container">
                <svg id="donut-chart" viewBox="0 0 36 36"></svg>
                <div class="chart-center">
                    <span class="chart-total" id="chart-total">0 ₽</span>
                    <span class="chart-label">Потрачено</span>
                </div>
            </div>

            <div class="chart-legend" id="chart-legend"></div>
        </main>

        <main id="screen-settings" class="screen hidden">
            <h2>Настройки</h2>
            <div class="settings-list">
                <button id="open-pet-selector" class="settings-btn">🐾 Сменить питомца</button>
                <button id="open-theme-selector" class="settings-btn">🌗 Сменить тему</button>
                <button id="open-style-selector" class="settings-btn">🎨 Стиль кнопок</button>
            </div>
        </main>

        <div class="bottom-spacer"></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" data-target="screen-home"><span class="nav-icon">🏠</span></div>
        <div class="nav-item" data-target="screen-expenses"><span class="nav-icon">💲</span></div>
        <div class="nav-item" data-target="screen-stats"><span class="nav-icon">📊</span></div>
        <div class="nav-item" data-target="screen-settings"><span class="nav-icon">⚙️</span></div>
    </nav>

    <!-- Модалки -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title">Заголовок</h3>
            <input type="text" id="modal-input-text" placeholder="Название" class="hidden">
            <input type="number" id="modal-input-number" placeholder="Сумма (₽)" class="hidden">
            <div class="modal-buttons">
                <button id="modal-cancel" class="btn-cancel">Отмена</button>
                <button id="modal-save" class="btn-save">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="pet-modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Выбери питомца</h3>
            <div class="pet-grid">
                <button class="pet-select-btn" data-pet="pet.gif">🐧 Пингвин</button>
                <button class="pet-select-btn" data-pet="frog.gif">🐸 Лягушка</button>
                <button class="pet-select-btn" data-pet="bee.gif">🐝 Пчела</button>
                <button class="pet-select-btn" data-pet="dolphin.gif">🐬 Дельфин</button>
                <button class="pet-select-btn" data-pet="elephant.gif">🐘 Слон</button>
            </div>
            <div class="modal-buttons" style="margin-top: 20px;">
                <button id="pet-modal-close" class="btn-cancel" style="width: 100%;">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="theme-modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Выбери тему</h3>
            <div class="theme-grid">
                <button class="theme-select-btn" data-theme="theme-light">☀️ Светлая</button>
                <button class="theme-select-btn" data-theme="theme-dark">🌙 Темная</button>
            </div>
            <div class="modal-buttons" style="margin-top: 20px;">
                <button id="theme-modal-close" class="btn-cancel" style="width: 100%;">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="style-modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Выбери стиль</h3>
            <div class="style-grid">
                <button class="style-select-btn" data-style="style-purple">Фиолетовый</button>
                <button class="style-select-btn" data-style="style-red">Красный</button>
                <button class="style-select-btn" data-style="style-blue">Синий</button>
                <button class="style-select-btn" data-style="style-green">Зеленый</button>
                <button class="style-select-btn" data-style="style-pink">Розовый</button>
                <button class="style-select-btn" data-style="style-pistachio">Фисташковый</button>
            </div>
            <div class="modal-buttons" style="margin-top: 20px;">
                <button id="style-modal-close" class="btn-cancel" style="width: 100%;">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
