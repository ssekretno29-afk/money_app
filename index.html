<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мани.точка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Заставка -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">💸</div>
            <h1 class="splash-title">FAT_KOPILKA</h1>
            <p class="splash-subtitle">Твой личный помощник</p>
        </div>
    </div>

    <div class="app-container">
        <!-- Шапка -->
        <header>
            <div class="greeting">Привет, <span id="user-name">друг</span></div>
            <div class="date" id="current-date">Октябрь 2026</div>
        </header>

        <!-- Блок целей -->
        <section class="goals-section">
            <div class="section-header">
                <h2>Мои цели <span id="goals-count" class="badge">0/15</span></h2>
            </div>
            <div id="goals-list" class="goals-list">
                <!-- Цели будут добавляться сюда -->
            </div>
            <button id="add-goal-btn" class="btn-outline">+ Добавить цель</button>
        </section>

        <!-- Главная фиолетовая карточка -->
        <section class="money-card">
            <div class="card-label">Осталось в этом месяце</div>
            <div class="card-amount" id="display-remainder">0 ₽</div>
            
            <div class="money-details">
                <div class="detail-item">
                    <span class="detail-label">Доход</span>
                    <span class="detail-value" id="display-income">0 ₽</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Обязательные</span>
                    <span class="detail-value" id="display-essentials">0 ₽</span>
                </div>
            </div>

            <div class="money-actions">
                <button id="edit-income-btn" class="btn-light">Изменить доход</button>
                <button id="add-essential-btn" class="btn-light">+ Обязательные</button>
                <button id="add-optional-btn" class="btn-light btn-danger">− Необязательные</button>
            </div>
        </section>

        <!-- Кнопка "Спланировать бюджет" -->
        <div class="plan-budget-btn" id="plan-budget-btn">
            <div class="icon-box">📊</div>
            <div class="text-box">
                <span class="title">Спланировать бюджет</span>
                <span class="subtitle">Распределите доход по категориям</span>
            </div>
        </div>

        <div class="bottom-spacer"></div>
    </div>

    <!-- Модальные окна -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title">Заголовок</h3>
            <input type="text" id="modal-input-text" placeholder="Название" class="hidden">
            <input type="number" id="modal-input-number" placeholder="Сумма (₽)" class="hidden">
            <div class="modal-buttons">
                <button id="modal-cancel" class="btn-cancel">Отмена</button>
                <button id="modal-save" class="btn-save">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
